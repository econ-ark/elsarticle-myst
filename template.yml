jtex: v1
title: Elsevier Template (CAS and elsarticle)
description: >
  Elsevier journal article template covering both of Elsevier's LaTeX
  classes. CAS (Complex Article Service) offers single column (cas-sc) and
  double column (cas-dc) layouts with CRediT roles; elsarticle offers the
  preprint and 1p/3p/5p production layouts. Both support author-year or
  numeric citations, ORCID identifiers, research highlights, graphical
  abstracts, and keywords.
version: 1.5.0
license: LPPL-1.3c
source: https://www.elsevier.com/authors/policies-and-guidelines/latex-instructions
thumbnail: ./thumbnail.png
authors:
  - name: Alan Lujan
    website: https://econ-ark.org
    github: alanlujan91
    affiliations:
      - Johns Hopkins University
      - Econ-ARK
tags:
  - paper
  - journal
  - elsevier
  - one-column
  - two-column
  - cas
  - elsarticle
# MyST's seven known parts plus `declaration`, the same set as econ-ark-myst.
# A part with no Elsevier slot goes in the body as ordinary content.
# See README.md "Document Parts".
parts:
  - id: abstract
    description: >
      A concise summary of the article's main findings and conclusions (100-300
      words). A frontmatter `abstract:` arrives here too.

      Do NOT cite a work here that nothing in the body cites. MyST excludes
      frontmatter parts from the rendered document and harvests the .bib from
      that document, so the citation reaches the .tex and never the .bib, and
      renders as `?` at exit 0. Upstream jupyter-book/mystmd#3032.
  - id: summary
    description: >
      Non-technical summary, printed as an unnumbered section headed "Summary"
      after the front matter and before the first heading.
  - id: keypoints
    description: >
      Research highlights (3-5 items), printed in Elsevier's highlights
      environment, one \\item per point. Write them as a YAML list under
      keypoints in the frontmatter or as a bullet list in a +++ keypoints
      block; each item is one point.
    as_list: true
  - id: graphical_abstract
    description: >
      A graphical abstract as raw LaTeX content. Alternatively, use the
      graphical_abstract option with a file path. If both are provided,
      parts.graphical_abstract wins.
  - id: dedication
    description: >
      Dedication, printed as a footnote to the title (a title note), the way
      Elsevier journals print one. It follows the funding statement when both
      are set.
  - id: epigraph
    description: >
      Epigraph, printed as a quote after the dedication and before the first
      heading, the quotation in small italics. End it with the citation as its
      own paragraph opening with `---`; that line is set upright, flush right.
  - id: biography
    description: >
      Author biographies as raw LaTeX. Use \\bio{} and \\endbio commands. For
      photo, use \\bio{path/to/photo}.
  - id: acknowledgments
    description: >
      Acknowledgments section, rendered as a first-page unnumbered footnote.
      Content appears at bottom of title page.
  - id: declaration
    description: >
      Declarations: one block for competing interests, generative-AI use and
      anything else the paper has to state. Rendered as an unnumbered section
      headed "Declarations" between the CRediT statement and the references.
      Supply only the statement text; the template emits the heading. Replaces
      `ai_declaration` (removed in 1.4.0).
  - id: data_availability
    description: >
      Data availability statement, rendered as an unnumbered section headed
      "Data Availability" after the declarations and before the references.
doc:
  - id: title
    required: true
  - id: subtitle
    description: |
      Article subtitle displayed below the main title.
  - id: short_title
    description: >
      Short title for running header (recommended max 50 characters). `&`, `%`
      and `#` are escaped automatically; `$`, `_`, `^` and `\` are left alone so
      that inline mathematics such as $x_1$ still typesets. A literal underscore
      outside mathematics must be written as `\_`.
  - id: authors
    required: true
    description: >
      List of authors. Each author supports: name, orcid, email, url,
      corresponding (boolean), roles (CRediT), equal_contributor (boolean),
      deceased (boolean), note (string for author-specific footnote), and social
      media links.

      Social media fields:
        - twitter:  Username only (e.g., "username", not full URL). Rendered as
                    an option to the \\author macro alongside facebook/linkedin.
        - facebook: Full profile URL (e.g., "https://facebook.com/username")
        - linkedin: Full profile URL (e.g., "https://linkedin.com/in/username")

      Equal-contribution behavior: when two or more authors carry
      equal_contributor: true, each marked author receives a shared \\fnmark
      linked to a single \\fntext that reads "These authors contributed equally
      to this work."

      Special LaTeX characters in `name`, `roles` and `note` are escaped
      automatically. `email` and `url` are emitted VERBATIM, because escaping
      `_` or `%` there breaks the link the class builds from them. A literal
      `%` or `#` in either field therefore breaks the LaTeX build; percent-
      encode it (`%25`, `%23`) or write `\%` yourself.
  - id: affiliations
    description: >
      List of affiliations. The fields this template emits into LaTeX are
      name/institution, department, address, city, state, postal_code and
      country; special characters in them are escaped automatically.

      `ror`, `isni` and `ringgold` are accepted by MyST and appear in the HTML
      and project metadata, but are NOT rendered in the PDF: neither cas-common
      nor elsarticle defines an \affiliation key for a persistent identifier.
      Setting them is harmless; expecting them in the typeset output is not.
  - id: tags
    description: >
      JEL classification codes, printed after the keywords as "JEL: ...".
      A list such as [D14, C61, G11] is joined with "; ". This is MyST's
      built-in tags key, reused rather than adding a custom one; if the paper
      also needs tags for site navigation, those would appear here too.
  - id: venue
    description: >
      Target journal. `venue.title` is emitted as elsarticle's \journal{},
      which prints in the preprint footer. Ignored by the CAS classes, which
      have no equivalent. MyST built-in; no custom option needed.
  - id: keywords
    description: >
      Article keywords (typically 3-6), joined with \\sep in LaTeX. Escaped
      per item, not after joining, so the separator survives; `&`, `%` and `#`
      are escaped and mathematics such as $\\alpha$-mixing is preserved.
  - id: bibliography
    description: |
      Path(s) to BibTeX bibliography files.
  - id: funding
    description: >
      MyST's built-in funding list. Each entry's `statement` is printed as the
      first title note, a footnote to the title, as Elsevier's own template
      shows a funding line; several statements join into one note. The
      statement is a raw string, so every LaTeX special in it is escaped.
options:
  - id: document_class
    type: choice
    title: Document Class
    description: >
      Which Elsevier class to typeset with. `cas` uses the CAS bundle
      (cas-sc / cas-dc, v2.4) and supports CRediT roles, short title, and
      short authors. `elsarticle` uses the elsarticle class (v3.5), which
      has none of those but is the more actively maintained of the two and
      is what many journals' author guidelines still name.
    default: cas
    choices:
      - cas
      - elsarticle
  - id: elsarticle_layout
    type: choice
    title: elsarticle Layout
    description: >
      Layout for the elsarticle class; ignored when document_class is `cas`.
      `preprint` is the double-spaced submission format. `1p`, `3p`, and `5p`
      are Elsevier's production layouts, in increasing density.
    default: preprint
    choices:
      - preprint
      - 1p
      - 3p
      - 5p
  - id: review
    type: boolean
    title: Review Mode
    description: >
      Double line spacing for review copies. elsarticle only; ignored when
      document_class is `cas`.
    default: false
  - id: blind
    type: choice
    title: Blinding
    description: >
      Anonymised submission. `double` maps to the doubleblind class option in
      both classes. `single` maps to singleblind, which only the CAS classes
      define; under elsarticle it has no effect, because elsarticle ships no
      singleblind option.

      Blinding covers the TITLE BLOCK only. Author names in body content are
      untouched, so parts.biography and any self-identifying text in the
      manuscript must be removed by hand before submitting a blind copy.
    default: none
    choices:
      - none
      - single
      - double
  - id: class_options
    type: string
    title: Extra Class Options
    description: >
      Raw comma-separated options appended verbatim to \documentclass, for
      anything without a named option above. This is deliberate: it covers
      every remaining class option, and any Elsevier adds later, without
      growing the template's key surface.

      elsarticle: nopreprintline, final, times, endfloat, numafflabel,
      longtitle, lefttitle, centertitle, reversenotenum.
      CAS: final.

      NOT validated. Two distinct failure modes: an option the selected class
      does not define is a LaTeX error, whereas an option whose support package
      is missing can be a SILENT no-op. elsarticle's endfloat is the second
      kind, guarded by \IfFileExists with an empty else-branch, so without
      endfloat.sty it does nothing and the build still succeeds. Check the PDF,
      not the flag. Avoid `nonatbib`: citation handling assumes natbib.
  - id: columns
    type: choice
    title: Column Layout
    description: Number of columns for the document layout.
    default: single
    choices:
      - single
      - double
  - id: citation_style
    type: choice
    title: Citation Style
    description: Bibliography citation style.
    default: authoryear
    choices:
      - authoryear
      - numbers
  - id: longmktitle
    type: boolean
    title: Long Title
    description: Enable if frontmatter (title, authors, abstract) spans multiple pages.
    default: false
  - id: graphical_abstract
    type: file
    title: Graphical Abstract
    description: Path to graphical abstract image file (PNG, JPG, or PDF).
files:
  - template.tex
  - cas-sc.cls
  - cas-dc.cls
  - cas-common.sty
  - cas-model2-names.bst
  - elsarticle.cls
  - elsarticle-num.bst
  - elsarticle-harv.bst
  - elsarticle-num-names.bst
  - thumbnails/cas-email.jpeg
  - thumbnails/cas-facebook.jpeg
  - thumbnails/cas-gplus.jpeg
  - thumbnails/cas-linkedin.jpeg
  - thumbnails/cas-twitter.jpeg
  - thumbnails/cas-url.jpeg
# Every package already loaded by template.tex or a class/style file in `files:`.
# jtex uses this to SUPPRESS its own \usepackage emission, so a missing entry
# means MyST re-loads a package the class already had. Populate via `jtex check`.
packages:
  - algorithm
  - algpseudocode
  - amsfonts
  - amsmath
  - amssymb
  - array
  - balance
  - booktabs
  - caption
  - cas-common
  - charis
  - colortbl
  - dcolumn
  - endfloat
  - etoolbox
  - expl3
  - fancyvrb
  - fontenc
  - fontspec
  - footmisc
  - fvextra
  - geometry
  - graphicx
  - hyperref
  - iftex
  - inconsolata
  - l3regex
  - makecell
  - moreverb
  - multirow
  - natbib
  - setspace
  - stfloats
  - stix
  - times
  - txfonts
  - wrapfig
  - xcolor
  - xparse
  - xspace
  - xstring
myst: v1
