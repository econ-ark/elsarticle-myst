name: build-pdf
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install mystmd
        run: npm install -g 'mystmd@^1.6'

      - name: Install TeX Live (XeLaTeX + extras + biber)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-bibtex-extra \
            texlive-science \
            texlive-pictures \
            biber \
            latexmk \
            lmodern

      - name: Verify l3kernel is recent enough
        run: |
          if kpsewhich expl3.sty >/dev/null; then
            ver=$(grep -m1 'expl3 release date' "$(kpsewhich expl3.sty)" 2>/dev/null || true)
            echo "expl3: $ver"
          fi
          if kpsewhich l3kernel.sty >/dev/null 2>&1; then
            echo "l3kernel present"
          fi

      # Must run after TeX Live: check F regenerates elsarticle.cls with latex
      # and SKIPS if latex is missing, which would read as a pass.
      - name: Verify upstream sources are pristine and patches match
        run: |
          # GitHub's default shell is `bash -e {0}` with NO pipefail, so
          # `verifier | tee` would report tee's status and every FAIL would
          # go green. Do not remove this line.
          set -eo pipefail
          ./scripts/verify-upstream.sh --self-test
          ./scripts/verify-upstream.sh | tee /tmp/verify.log
          if grep -q '^skip' /tmp/verify.log; then
            echo "::error::a check was skipped rather than run"
            exit 1
          fi

      - name: Build example PDFs
        working-directory: example
        run: |
          # The exports are git-tracked, so a checkout already contains last
          # commit's PDFs. Without deleting them first, a build that produces
          # nothing leaves stale artifacts for the later gates to "verify".
          set -eo pipefail
          rm -f exports/*.pdf
          myst build sample-article.md --pdf --force 2>&1 | tee build.stdout.log

      - name: Fail on LaTeX errors in compile logs
        run: |
          set -e
          shopt -s nullglob globstar
          fail=0
          n=0
          for log in example/exports/*_pdf_logs/*.log example/exports/*_pdf_tex/*.log; do
            # -s, not -f. Half the files this glob matches are zero-byte
            # *.shell.log, and grepping an empty file reports "clean", so
            # counting them lets six empties satisfy the threshold below.
            [ -s "$log" ] || continue
            n=$((n + 1))
            echo "::group::$log"
            # '^! ' is TeX's fatal-error convention, a superset of the named
            # messages; undefined refs and citations are WARNINGS that render
            # as '?'. See README.md "What CI asserts" for why each is here.
            if grep -E '^! |Misplaced alignment tab character|Undefined control sequence|LaTeX Error:|Emergency stop|! Package .* Error|\*\*\* \(Job aborted|Warning: (Reference|Citation).*undefined|There were undefined (references|citations)' "$log"; then
              echo "::error file=$log::LaTeX errors found"
              fail=1
            else
              echo "clean"
            fi
            echo "::endgroup::"
          done
          # nullglob means zero logs iterates zero times and passes. A build
          # that wrote no logs at all must fail here, not sail through.
          if [ "$n" -lt 6 ]; then
            echo "::error::only $n NON-EMPTY compile log(s) found; expected at least 6"
            exit 1
          fi
          # Positive control: the clean verdicts above are worthless unless
          # xelatex actually ran. A log can exist, be non-empty, and still
          # predate this build.
          x=$(grep -lc 'This is XeTeX' example/exports/*_pdf_logs/*.log 2>/dev/null | wc -l)
          if [ "$x" -lt 6 ]; then
            echo "::error::only $x log(s) show a XeTeX run; the clean results above are vacuous"
            exit 1
          fi
          echo "$n non-empty log(s) checked, $x with a confirmed XeTeX run"
          if [ "$fail" -ne 0 ]; then
            echo "One or more compile logs contained errors. See annotations above."
            exit 1
          fi

      # mystmd deletes the .blg with the other aux files, so build.stdout.log is
      # the only surviving bibtex output. 'gave return code' is here because
      # mystmd copies the PDF even after xelatex has exited non-zero.
      - name: Fail on bibtex errors and non-zero latex exits
        working-directory: example
        run: |
          set -e
          if [ ! -s build.stdout.log ]; then
            echo "::error::build.stdout.log is missing; the build gate has nothing to read"
            exit 1
          fi
          # Positive control: bibtex must actually have run, or an empty
          # bibliography would satisfy every pattern below by never appearing.
          if ! grep -q 'This is BibTeX' build.stdout.log; then
            echo "::error::bibtex never ran; this gate would pass on any input"
            exit 1
          fi
          if grep -E "didn't find a database entry|I couldn't open|Warning--|gave return code" build.stdout.log; then
            echo "::error::bibtex or latexmk reported a problem; see above"
            exit 1
          fi
          # A jtex render error reaches no compile log: mystmd prints "Exported
          # TeX", then the error, then exits 0, leaving a stale PDF on disk.
          # See README.md "What CI asserts" for the third pattern's history.
          if grep -E 'Template render error|TypeError|Unhandled TEX conversion' build.stdout.log; then
            echo "::error::the template failed to render; any PDF on disk is stale"
            exit 1
          fi
          echo "bibtex ran and the template rendered with no errors"

      # The template escapes LaTeX specials in raw frontmatter strings. That was
      # documented and never asserted, and title/subtitle/keywords/tags/author
      # names were silently unescaped for six releases. Assert the escaping.
      - name: Round-trip LaTeX specials through the template
        run: |
          set -eo pipefail
          ./scripts/check-escaping.sh --self-test
          ./scripts/check-escaping.sh
        run: |
          set -e
          for name in sample-sc sample-dc sample-sc-numbers sample-long sample-elsarticle sample-elsarticle-5p; do
            f="example/exports/${name}.pdf"
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty"
              exit 1
            fi
            echo "ok: $f ($(stat -c '%s' "$f") bytes)"
          done

      # class_options reach the class unvalidated, and elsarticle's endfloat
      # option has an EMPTY else-branch: absent endfloat.sty it silently does
      # nothing and the build passes. Assert the effect, not the flag.
      - name: Verify class_options actually took effect
        run: |
          set -eo pipefail
          t=$(pdftotext example/exports/sample-elsarticle-5p.pdf - | grep -c 'about here' || true)
          if [ "$t" -lt 1 ]; then
            echo "::error::endfloat produced no float markers; the class option was a no-op"
            exit 1
          fi
          echo "endfloat: $t float marker(s)"
          # POSITIVE CONTROL FIRST: this absence assertion is keyed on a
          # hard-coded surname, so renaming the example's authors would leave it
          # green and vacuous. Prove the needle exists unblinded before trusting.
          n=$(pdftotext -f 1 -l 4 example/exports/sample-elsarticle.pdf - | grep -ci 'Lujan' || true)
          if [ "$n" -lt 1 ]; then
            echo "::error::'Lujan' does not appear in the unblinded title block; the doubleblind check below is vacuous. Update the surname it looks for."
            exit 1
          fi
          echo "doubleblind positive control: $n occurrence(s) in the unblinded export"
          # Frontmatter pages only. doubleblind anonymises the title block; it
          # does NOT strip author names from body content such as parts.biography,
          # so scanning the whole PDF would fail for a reason blinding never promised.
          if pdftotext -f 1 -l 4 example/exports/sample-elsarticle-5p.pdf - | grep -qi 'Lujan'; then
            echo "::error::doubleblind export still names an author in the title block"
            exit 1
          fi
          echo "doubleblind: title block carries no author names"

      # A blank graphical abstract passes every other gate: exit 0, no LaTeX
      # error, and pdfimages lists the image as present. Only rasterising it
      # catches the failure.
      - name: Verify the graphical abstract page is not blank
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils imagemagick
          ./scripts/check-ink.sh --self-test
          fail=0
          for name in sample-sc sample-dc sample-sc-numbers sample-long sample-elsarticle sample-elsarticle-5p; do
            ./scripts/check-ink.sh "example/exports/${name}.pdf" 1 0.8 || fail=1
          done
          exit "$fail"

      # Every gate above asks whether the build SUCCEEDED. This one asks what it
      # PRODUCED. It is what would have caught the appendix headings shipping as
      # ".1. Supplementary Methods" and the appendix table as "Table .5".
      - name: Diff PDF text against committed snapshots
        run: |
          set -eo pipefail
          ./scripts/check-content.sh --self-test
          ./scripts/check-content.sh

      - name: Upload PDFs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-pdfs
          path: example/exports/*.pdf
          if-no-files-found: warn

      - name: Upload TeX/log artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            example/exports/**/*.log
            example/exports/**/*.tex
            example/build.stdout.log
          if-no-files-found: warn
